spring.application.name=rtm-iam
server.port=${APP_IAM_PORT:3001}

# Carga las variables del archivo .env (solo en local)
spring.config.import=optional:file:.env[.properties]

# Base compartida rentamovil, con el usuario iam_app (nunca sa)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# Las tablas las crea rtm-iam-db (Liquibase). Hibernate solo valida que coincidan.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=iam
# Las fechas se leen y escriben en UTC (ver IamApplication)
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Seguridad
app.iam.bcrypt-rounds=${APP_IAM_BCRYPT_ROUNDS:12}
app.iam.jwt.private-key=${APP_IAM_JWT_PRIVATE_KEY:}
app.iam.jwt.public-key=${APP_IAM_JWT_PUBLIC_KEY:}
# Vida del access token (30 min) y del refresh token (7 días), en segundos
app.iam.jwt.expiry=${APP_IAM_JWT_EXPIRY:1800}
app.iam.refresh-token-expiry=${APP_IAM_REFRESH_TOKEN_EXPIRY:604800}
# Vida del código de recuperación de contraseña (15 min, entities-and-rules.md)
app.iam.password-reset.code-expiry=${APP_IAM_PASSWORD_RESET_CODE_EXPIRY:900}
# Vida del código de verificación de cuenta al registrarse (15 min, misma regla que el de recuperación)
app.iam.email-verification.code-expiry=${APP_IAM_EMAIL_VERIFICATION_CODE_EXPIRY:900}
# Foto de perfil: solo se aceptan URLs de la cuenta de Cloudinary del frontend
app.iam.profile-image.allowed-prefix=${APP_IAM_PROFILE_IMAGE_ALLOWED_PREFIX:https://res.cloudinary.com/dz6ohgjub/image/upload/}


# SMTP Configuration
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.from.email=${SMTP_FROM_EMAIL:noreply@rentamovil.com}
app.mail.from.name=${SMTP_FROM_NAME:RentaMovil}